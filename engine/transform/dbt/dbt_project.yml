# Migryr transformation project. Models and seeds are generated from the mapping spec
# (transform/spec/*.yml) by transform/build_dbt.py; only this file, profiles.yml and macros/ are hand-written.
name: migryr
version: "1.0.0"
config-version: 2
profile: migryr

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
# target and log folders are passed per run on the command line (--target-path, --log-path)

models:
  migryr:
    staging:
      +materialized: view
      +schema: staging
    mid:
      +materialized: table
      +schema: mid
    target:
      +materialized: table
      +schema: target
    audit:
      +materialized: table
      +schema: audit

seeds:
  migryr:
    +schema: decisions
    +column_types:
      kind: varchar
      duplicate: varchar
      survivor: varchar
      column_name: varchar
