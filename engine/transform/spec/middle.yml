  types:
    lead_id: VARCHAR
    full_name: VARCHAR
    title: VARCHAR
    status: VARCHAR
    source: VARCHAR
    client_id: VARCHAR
    contact_id: VARCHAR
    job_id: VARCHAR
    email: VARCHAR
    phone: VARCHAR
    note: VARCHAR
    assigned_to: VARCHAR
    sourced_at: TIMESTAMP
