      line_id: i.ItemID
      timesheet_id: i.Timesheet_ID
      candidate_id: i.Person_ID
      job_id: i.Req_ID
      line_type: tt."Desc"
      start_time: i.StartTime
      end_time: i.EndTime
      hours: i.TotalHours
      added_by: i.CreatedBy
      created_at: i.CreatedAt
  types:
    line_id: VARCHAR
    timesheet_id: VARCHAR
    candidate_id: VARCHAR
    job_id: VARCHAR
    line_type: VARCHAR
    start_time: VARCHAR
    end_time: VARCHAR
    hours: DECIMAL(12,2)
    added_by: VARCHAR
    created_at: TIMESTAMP
- key: purchase_orders
