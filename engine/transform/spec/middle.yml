      deleted: sc.Deleted
  types:
    category_id: VARCHAR
    name: VARCHAR
    deleted: BOOLEAN
- key: skills
  table: Skills
  label: Skills
  selects:
  - from: src__Skills AS sk
    joins: []
    where: ''
    columns:
      skill_id: sk.SkillID
      name: sk.SkillName
      category_id: sk.Skill_CategoryID
      deleted: sk.Deleted
  types:
    skill_id: VARCHAR
    name: VARCHAR
    category_id: VARCHAR
    deleted: BOOLEAN
- key: applications
  table: Applications
  label: Applications
  selects:
  - from: src__Req_Hired AS h
    joins: []
    where: ''
    columns:
      application_id: h.Req_HiredID
      candidate_id: h.Invoiced_PersonID
      job_id: h.Req_ID
      client_id: h.Account_ID
      contact_id: h.Associate_ID
      stage: LOWER(h.Pipeline_Stage)
      employment_type: LOWER(h.Worktype)
      start_date: CAST(h.StartDate AS DATE)
      end_date: CAST(h.EndDate AS DATE)
      fee: h.FeeValue
      source: LOWER(h.Source)
      owner_user_id: h.Owner_ID
      deleted: h.Deleted
      applied_at: h.CreatedAt
  types:
    application_id: VARCHAR
    candidate_id: VARCHAR
    job_id: VARCHAR
    client_id: VARCHAR
    contact_id: VARCHAR
    stage: VARCHAR
    employment_type: VARCHAR
    start_date: DATE
    end_date: DATE
    fee: DECIMAL(12,2)
    source: VARCHAR
    owner_user_id: VARCHAR
    deleted: BOOLEAN
    applied_at: TIMESTAMP
- key: interviews
  table: Interviews
  label: Interviews
  selects:
  - from: src__Interview_Feedback AS f
    joins: []
    where: ''
    columns:
      interview_id: f.Interview_FeedbackID
      candidate_id: f.Interviewee_ID
      interviewer_person_id: f.Interviewer_ID
      interview_date: f.Interview_Date
      feedback: f.Notes
      callback: f.Callback
      created_at: f.CreatedAt
  types:
    interview_id: VARCHAR
    candidate_id: VARCHAR
    interviewer_person_id: VARCHAR
    interview_date: TIMESTAMP
    feedback: VARCHAR
    callback: VARCHAR
    created_at: TIMESTAMP
- key: work_history
  table: WorkHistory
  label: Work history
  selects:
  - from: src__EmpHist AS eh
    joins:
    - JOIN src__Emp_Profile AS ep ON ep.Emp_ProfileID = eh.Emp_ID
    where: ''
    columns:
      history_id: eh.Hist_ID
      candidate_id: ep.Person_ID
      employer: eh.PlaceofWork
      job_title: eh.Title
      start_date: CAST(eh.Started_At AS DATE)
      end_date: CAST(eh.Ended_At AS DATE)
      deleted: eh.Deleted
  types:
    history_id: VARCHAR
    candidate_id: VARCHAR
    employer: VARCHAR
    job_title: VARCHAR
    start_date: DATE
    end_date: DATE
    deleted: BOOLEAN
- key: references
  table: References
  label: References
  selects:
  - from: src__EmpRef AS er
    joins:
    - JOIN src__Referees AS rf ON rf.Referee_ID = er.Ref_ID
    - JOIN src__Emp_Profile AS ep ON ep.Emp_No = er.EmpNo
    where: ''
    columns:
      reference_id: er.EmpRef_ID
      candidate_id: ep.Person_ID
      full_name: rf.Fullname
      job_title: rf.Job_Title
      company: rf.Company
      relationship: er.Relationship
      email: rf.email
      phone: rf.Telephone
      status: er.Status
      reference_text: er.Reference
      created_at: er.CreatedAt
      updated_at: er.UpdatedAt
  types:
    reference_id: VARCHAR
    candidate_id: VARCHAR
    full_name: VARCHAR
    job_title: VARCHAR
    company: VARCHAR
    relationship: VARCHAR
    email: VARCHAR
    phone: VARCHAR
    status: VARCHAR
    reference_text: VARCHAR
    created_at: TIMESTAMP
    updated_at: TIMESTAMP
- key: candidate_profiles
  table: CandidateProfiles
  label: Candidate profiles
  selects:
