  label: Timesheets
  selects:
  - from: src__TimeSheets AS t
    joins:
    - LEFT JOIN src__TimesheetType AS tt ON tt.Timesheet_TypeID = t.Timesheet_TypeID
    where: ''
    columns:
      timesheet_id: t.ID
      po_no: t.PONo
      timesheet_type: tt."Desc"
      pay_rate: t.Payrate
      charge_rate: t.Billrate
      start_date: CAST(t.StartDate AS DATE)
      end_date: CAST(t.Enddate AS DATE)
      status: LOWER(t.Status)
      approved_by: t.Approved_By
      approved_at: t.Approved_Date
