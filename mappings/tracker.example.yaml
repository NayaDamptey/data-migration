# Example mapping spec: illustrative Tracker-style source → canonical.
# Table and column names here are examples, not a verified Tracker schema.
spec_version: 1
source_system: tracker
canonical_version: 0.1
review_threshold: 0.85

tables:
  CANDIDATE:  {entity: candidates, confidence: 0.98, reason: "Referenced by PLACEMENT and ACTIVITY; has CV-style fields"}
  COMPANY:    {entity: clients,    confidence: 0.97, reason: "Referenced by CONTACT and VACANCY"}
  CONTACT:    {entity: contacts,   confidence: 0.96, reason: "FK to COMPANY; job titles and direct lines"}
  VACANCY:    {entity: jobs,       confidence: 0.95, reason: "FK to COMPANY and CONTACT; salary fields"}
  PLACEMENT:  {entity: placements, confidence: 0.97, reason: "Joins CANDIDATE to VACANCY with dates and fee"}
  NOTE:       {entity: notes,      confidence: 0.93, reason: "LinkType + LinkID polymorphic link, long text"}
  AUDIT:      {entity: histories,  confidence: 0.90, reason: "Old/new value pairs with table and field names"}
  TMP_IMPORT_2019: {entity: ignore, confidence: 0.80, reason: "Looks like a one-off import table"}

entities:
  candidates:
    from: CANDIDATE
    fields:
      candidate_id:      {from: CANDIDATE.CandidateID, confidence: 0.99, status: approved}
      first_name:        {from: CANDIDATE.Forename, confidence: 0.98, status: approved}
      last_name:         {from: CANDIDATE.Surname, confidence: 0.98, status: approved}
      email:             {from: CANDIDATE.Email1, confidence: 0.97, status: approved}
      mobile:            {from: CANDIDATE.MobileTel, transform: normalise_uk_phone, confidence: 0.94, status: approved}
      current_job_title: {from: CANDIDATE.CurrentPosition, confidence: 0.92, status: approved}
      address_line_1:
        from: CANDIDATE.Address
        transform: split_address
        part: line_1
        confidence: 0.71
        status: needs_review
        reason: "Address is one free-text field; split is a best guess"
      city:
        from: CANDIDATE.Address
        transform: split_address
        part: city
        confidence: 0.71
        status: needs_review
      postcode:          {from: CANDIDATE.PostCode, transform: normalise_postcode, confidence: 0.96, status: approved}
      source:
        from: CANDIDATE.HowHeard
        transform: value_map
        values:
          "Totaljobs": job_board
          "TJ": job_board
          "total jobs": job_board
          "Referral": referral
          "LinkedIn": linkedin
        unmapped_values: ["Other", "?"]
        confidence: 0.78
        status: needs_review
      owner_user_id:     {from: CANDIDATE.ConsultantID, confidence: 0.95, status: approved}
      created_at:        {from: CANDIDATE.DateRegistered, transform: parse_date, formats: ["DD/MM/YYYY HH:mm"], confidence: 0.93, status: approved}
      linkedin_url:      {from: null, confidence: 0, status: needs_review, reason: "No matching column found"}

questions:
  - id: q1
    entity: candidates
    field: status
    text: "Values 1–5 appear in CANDIDATE.Stage. Which one means Placed?"
    options: ["1", "2", "3", "4", "5", "None of these"]
