services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
      POSTGRES_DB: migration
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: ["./pipeline:/pipeline", "./canonical:/canonical", "./mappings:/mappings"]

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./pipeline:/pipeline", "./canonical:/canonical", "./mappings:/mappings"]

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    volumes: ["./frontend:/app"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
