# Canonical recruitment model: first draft.
# Every source maps INTO this; every target maps OUT of it.
# types: id, ref:<entity>, text, long_text, email, phone, url, postcode,
#        enum, boolean, date, datetime, money, integer
version: 0.1

entities:
  users:
    description: Recruiters, managers and admins who own records in the source CRM.
    key: user_id
    fields:
      user_id:        {type: id, required: true}
      first_name:     {type: text}
      last_name:      {type: text}
      email:          {type: email, required: true}
      role:           {type: enum, values: [recruiter, manager, admin, other]}
      office:         {type: text}
      is_active:      {type: boolean}

  clients:
    description: Companies the agency recruits for.
    key: client_id
    fields:
      client_id:      {type: id, required: true}
      company_name:   {type: text, required: true}
      industry:       {type: enum}
      website:        {type: url}
      phone:          {type: phone}
      address_line_1: {type: text}
      address_line_2: {type: text}
      city:           {type: text}
      postcode:       {type: postcode}
      country:        {type: text}
      status:         {type: enum, values: [active, prospect, inactive]}
      owner_user_id:  {type: ref:users}
      created_at:     {type: datetime}

  contacts:
    description: People who work at client companies (hiring managers, HR).
    key: contact_id
    fields:
      contact_id:     {type: id, required: true}
      client_id:      {type: ref:clients, required: true}
      first_name:     {type: text}
      last_name:      {type: text, required: true}
      job_title:      {type: text}
      email:          {type: email}
      phone:          {type: phone}
      mobile:         {type: phone}
      status:         {type: enum, values: [active, left_company, inactive]}
      owner_user_id:  {type: ref:users}
      created_at:     {type: datetime}

  candidates:
    description: Job seekers the agency represents.
    key: candidate_id
    fields:
      candidate_id:      {type: id, required: true}
      first_name:        {type: text, required: true}
      last_name:         {type: text, required: true}
      email:             {type: email}
      mobile:            {type: phone}
      phone:             {type: phone}
      current_job_title: {type: text}
      current_employer:  {type: text}
      address_line_1:    {type: text}
      address_line_2:    {type: text}
      city:              {type: text}
      postcode:          {type: postcode}
      country:           {type: text}
      source:            {type: enum}
      status:            {type: enum, values: [available, placed, not_looking, archived]}
      linkedin_url:      {type: url}
      owner_user_id:     {type: ref:users}
      created_at:        {type: datetime}
    rules:
      - at_least_one_of: [email, mobile, phone]

  jobs:
    description: Vacancies the agency is working on for a client.
    key: job_id
    fields:
      job_id:          {type: id, required: true}
      client_id:       {type: ref:clients, required: true}
      contact_id:      {type: ref:contacts}
      title:           {type: text, required: true}
      employment_type: {type: enum, values: [permanent, contract, temporary, fixed_term]}
      salary_min:      {type: money}
      salary_max:      {type: money}
      rate:            {type: money}
      rate_unit:       {type: enum, values: [hour, day, week, year]}
      location:        {type: text}
      status:          {type: enum, values: [open, on_hold, filled, closed, cancelled]}
      owner_user_id:   {type: ref:users}
      opened_at:       {type: date}
      closed_at:       {type: date}

  placements:
    description: A candidate placed into a job.
    key: placement_id
    fields:
      placement_id:   {type: id, required: true}
      candidate_id:   {type: ref:candidates, required: true}
      job_id:         {type: ref:jobs, required: true}
      start_date:     {type: date}
      end_date:       {type: date}
      salary:         {type: money}
      fee:            {type: money}
      placement_type: {type: enum, values: [permanent, contract, temporary]}
      owner_user_id:  {type: ref:users}

  notes:
    description: Free-text notes attached to any record.
    key: note_id
    fields:
      note_id:        {type: id, required: true}
      entity_type:    {type: enum, values: [candidate, contact, client, job, placement]}
      entity_id:      {type: id, required: true}
      author_user_id: {type: ref:users}
      note_type:      {type: enum}
      body:           {type: long_text}
      created_at:     {type: datetime}

  histories:
    description: Field-level change history / audit trail from the source.
    key: history_id
    fields:
      history_id:    {type: id, required: true}
      entity_type:   {type: enum}
      entity_id:     {type: id, required: true}
      field_changed: {type: text}
      old_value:     {type: text}
      new_value:     {type: text}
      changed_by:    {type: ref:users}
      changed_at:    {type: datetime}

  activities:
    description: Calls, emails, meetings, interviews and other logged actions.
    key: activity_id
    fields:
      activity_id:   {type: id, required: true}
      activity_type: {type: enum, values: [call, email, meeting, interview, submission, task, other]}
      candidate_id:  {type: ref:candidates}
      contact_id:    {type: ref:contacts}
      job_id:        {type: ref:jobs}
      user_id:       {type: ref:users}
      occurred_at:   {type: datetime}
      outcome:       {type: text}
      subject:       {type: text}

  documents:
    description: CVs and other files attached to records.
    key: document_id
    fields:
      document_id:  {type: id, required: true}
      entity_type:  {type: enum, values: [candidate, contact, client, job, placement]}
      entity_id:    {type: id, required: true}
      file_name:    {type: text, required: true}
      file_type:    {type: text}
      storage_path: {type: text, required: true}
      uploaded_at:  {type: datetime}
